<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/css/common.css">
    <title>Post details page</title>
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-container">
            <div class="header__text">
                <h2 th:text="'Title: ' + ${post.title}"></h2>
            </div>
        </div>
        <div class="records-container">
            <div class="record">
                <div class="record__title">
                    <span th:text="'Id: ' + ${post.id}"></span>
                </div>
            </div>
            <div class="record">
                <div class="record__title">
                    <span th:text="'Author: ' + ${post.author}"></span>
                </div>
            </div>
            <div class="record">
                <div class="record__title">
                    <span th:text="'Creation Date: ' + ${post.creationTime}"></span>
                </div>
            </div>
            <div class="record">
                <div class="record__title">
                    <span th:text="'Number of Likes: ' + ${post.numberOfLikes}"></span>
                </div>
            </div>
            <div class="record">
                <div class="record__title">
                    <span th:text="'Number of Dislikes: ' + ${post.numberOfDislikes}"></span>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="header-container">
            <div class="header__text">
                <h2>Update post</h2>
            </div>
        </div>
        <div class="form-container">
            <form th:action="@{/posts/{postId}/update(postId=${post.id})}" method="post" class="form-container__form">
                <div class="form-container__input-wrapper">
                    <input th:value="${post.author}" type="hidden" name="author">
                </div>
                <div class="form-container__input-wrapper">
                    <input th:value="${post.title}" type="text" name="title" class="form-container__input" placeholder="Enter title" required>
                </div>
                <div class="form-container__input-wrapper">
                    <input th:value="${post.numberOfLikes}" type="number" name="numberOfLikes" class="form-container__input" placeholder="Enter number of likes" required>
                </div>
                <div class="form-container__input-wrapper">
                    <input th:value="${post.numberOfDislikes}" type="number" name="numberOfDislikes" class="form-container__input" placeholder="Enter number of dislikes" required>
                </div>
                <div class="form-container__button-wrapper">
                    <button type="submit" class="form-container__button">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
